<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">V</div>

      <div>
        <h1>VeriEviX</h1>
        <p>Explainable Evidence-Based Verification</p>
      </div>
    </div>

    <div class="welcome">
      <h2>Welcome back</h2>
      <p>Verify. Explain. Trust.</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
        />
      </div>
      <button
        type="button"
        class="login-button"
        (click)="login()"
>
        Sign in
      </button>
      
    </form>

    <div class="login-footer">
      <span>Gemini Response Verification</span>
    </div>

  </div>

</div>
